# DNS防泄露版本
# 不是必须请勿用，不懂不要随便更改DNS模块
# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。

# 机场订阅
proxy-providers:
  3in1:
    url: ""
    type: http
    interval: 43200
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# 已修正：移除了错误的 interface-name 参数，直接依赖 tun 模块的 auto-detect-interface
log-level: warning
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
# 跑裸核朋友自行删除注释即可，使用nikki仅内核的ui路径改为/etc/nikki/run/ui
external-controller: 0.0.0.0:9090
secret: "693132"
external-ui: "/etc/mihomo/ui"
external-ui-name: zashboard
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: system
  # 脚本会自动在文件开头管理 interface-name，此处保持缺省
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #使用仅内核自行修改下面三项为true
  #device: nikki
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16 # 【已修正】使用标准的保留地址，避免公网冲突
  fake-ip-filter-mode: blacklist
  proxy-server-nameserver:
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  nameserver-policy:
    # 【已修正】必须拆分开写，Mihomo 不支持逗号合并引用
    "rule-set:private_domain":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:cn_domain":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:apple_domain":
      - 223.5.5.5
      - 119.29.29.29
  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:apple_domain"
 
# 出站策略
# 已修改：仅保留日本、美国和直连
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 📹 YouTube, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 美国故转, 🔯 日本故转, 🇺🇲 美国节点, 🇯🇵 日本节点, 直连]}
  - {name: 🍀 Google, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 🤖 ChatGPT, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 🐬 OneDrive, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 🪟 Microsoft, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 📲 Telegram, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, ♻️ 日本自动, ♻️ 美国自动, 🔯 日本故转, 🔯 美国故转, 🇯🇵 日本节点, 🇺🇲 美国节点, 直连]}
  
  # 地区分组 - 仅保留日本和美国
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🔯 日本故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: 🔯 美国故转, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"}

# 规则匹配
# 此规则部分没有做防泄露处理，因为弊严重大于利！
rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - DOMAIN-SUFFIX,qichiyu.com,🚀 默认代理
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,直连
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - MATCH,🐟 漏网之鱼

# 规则集
